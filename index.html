<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Finzy</title>

    <!-- BOOTSTRAP -->
    <link rel="stylesheet" href="static/bootstrap/css/bootstrap.min.css" />
    
    <link href="https://maxcdn.bootstrapcdn.com/font-awesome/4.3.0/css/font-awesome.min.css" rel="stylesheet"/>
    <!-- BOOTSTRAP -->

    <!-- SWEETALERT2 -->
    <link rel="stylesheet" href="static/sweetalert2/sweetalert2.css" />
    <script src="static/sweetalert2/sweetalert2.js"></script>
    <!-- SWEETALERT2 -->

    <link rel="stylesheet" href="static/css/styles.css" />
</head>
<body>
    <div class="page-wrapper">
 
        <!-- ===== Decorative abstract shapes ===== -->
        <div class="shape shape-orange-blob"></div>
        <div class="shape shape-navy-dot"></div>
        <div class="shape shape-lavender-blob"></div>
        <div class="shape shape-lavender-blob-desktop d-none d-lg-block"></div>
        <div class="shape shape-orange-ring-desktop d-none d-lg-block"></div>
        <div class="shape shape-navy-dot-desktop d-none d-lg-block"></div>
        
        <!-- ===== Logo (top-left) ===== -->
        <a href="#" class="brand-header">
            <img src="static/images/head.png" alt="Finzy" class="brand-logo">
            <span class="brand-name">Finzy</span>
        </a>

        <!-- ===== Language switcher (top-right) ===== -->
        <div class="lang-switch">
            <button type="button" data-lang="id">ID</button>
            <button type="button" data-lang="en">EN</button>
        </div>
        
        <!-- ===== Hero ===== -->
        <main class="hero-container">
        
            <!-- Text -->
            <div class="text-content">
                <h1 class="hero-title" data-translate-html="hero_title">Let's pop<br>some tasks!</h1>
                <p class="hero-subtitle" data-translate-html="hero_subtitle">Say goodbye to procrastination.<br>Welcome to Foxy.</p>
            
                <div class="hero-buttons">
                    <a href="report.html" role="button" class="btn btn-signup" data-translate="btn_get_started">Let's Get Started</a>
                </div>
            </div>
        
            <!-- Fox mascot -->
            <div class="fox-wrap">
                <img src="static/images/head.png" alt="Foxy mascot" class="fox-image fox-mobile">
                <img src="static/images/body.png" alt="Foxy mascot" class="fox-image fox-desktop">
            </div>
        
        </main>
        
    </div>

    <script src="static/bootstrap/js/bootstrap.min.js"></script>
    <script src="static/js/translate.js"></script>
</body>
</html>
